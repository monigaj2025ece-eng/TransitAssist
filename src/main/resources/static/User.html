<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>TransitAssist | User Registration</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .form-card {
            width: 86%;
            margin: 45px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        .form-card h2 {
            color: #123b4a;
            margin-bottom: 10px;
        }

        .form-card p {
            color: #718087;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #123b4a;
        }

        .form-group input,
        .form-group select {
            padding: 14px;
            border: 1px solid #ccd7da;
            border-radius: 10px;
            font-size: 16px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 28px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #123b4a;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #168f83;
        }

        #message {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            display: none;
        }

        .success {
            display: block !important;
            background: #e2f6ef;
            color: #168f83;
        }

        @media(max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-card {
                width: 78%;
            }

        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">
        Transit<span>Assist</span>
    </div>

    <div class="nav-links">

        <a href="index.html">Home</a>

        <a href="user.html">
            User Registration
        </a>

        <a href="request.html">
            Request Assistance
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="staff.html">
            Staff
        </a>

        <a href="assignments.html">
            Assignments
        </a>

    </div>

</nav>



<div class="page-header">

    <h1>
        User Registration
    </h1>

    <p>
        Register passenger details for accessible transit assistance.
    </p>

</div>



<div class="form-card">

    <h2>
        Passenger Information
    </h2>

    <p>
        Enter the passenger details below.
    </p>


    <form id="userForm">


        <div class="form-grid">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                        type="text"
                        id="name"
                        placeholder="Enter full name"
                        required>

            </div>



            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required>

            </div>



            <div class="form-group">

                <label>
                    Phone
                </label>

                <input
                        type="text"
                        id="phone"
                        placeholder="Enter phone number"
                        required>

            </div>



            <div class="form-group">

                <label>
                    Assistance / Disability Type
                </label>

                <select
                        id="disabilityType"
                        required>

                    <option value="">
                        Select type
                    </option>

                    <option>
                        Wheelchair User
                    </option>

                    <option>
                        Visual Assistance
                    </option>

                    <option>
                        Hearing Assistance
                    </option>

                    <option>
                        Elderly Assistance
                    </option>

                    <option>
                        Other
                    </option>

                </select>

            </div>


        </div>



        <button
                type="submit"
                class="submit-btn">

            REGISTER USER

        </button>


    </form>


    <div id="message"></div>


</div>



<footer class="footer">

    © 2026 TransitAssist |
    Accessible Transportation Support

</footer>



<script>


    document.getElementById("userForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const userData = {

                name:
                document.getElementById("name").value,

                email:
                document.getElementById("email").value,

                phone:
                document.getElementById("phone").value,

                disabilityType:
                document.getElementById("disabilityType").value

            };


            try {

                const response = await fetch(
                    "/api/users",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(userData)
                    }
                );


                if(response.ok) {

                    const user =
                        await response.json();


                    const message =
                        document.getElementById("message");


                    message.innerText =
                        "User registered successfully! User ID: "
                        + user.userId;


                    message.className =
                        "success";


                    document.getElementById("userForm")
                        .reset();

                }

                else {

                    alert("Unable to register user.");

                }

            }

            catch(error) {

                alert("Server connection error.");

            }

        });


</script>


</body>

</html>
